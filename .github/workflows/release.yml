name: Release

# Manual only, so a pushed tag never distributes anything on its own.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (v1.2.3); must match CFBundleShortVersionString
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}

      - name: Check the tag matches the app version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          [[ "$TAG" == "v$version" ]] || { echo "::error::$TAG does not match v$version"; exit 1; }

      # A throwaway keychain holds the signing identity and is deleted even when the job fails.
      # A stable identity keeps the designated requirement, and with it Accessibility, across updates.
      - name: Configure signing
        env:
          CODESIGN_CERTIFICATE: ${{ secrets.CODESIGN_CERTIFICATE }}
          CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${CODESIGN_CERTIFICATE:-}" || -z "${SPARKLE_PRIVATE_KEY:-}" ]]; then
            echo "::error::CODESIGN_CERTIFICATE and SPARKLE_PRIVATE_KEY must be set"
            exit 1
          fi
          keychain="$RUNNER_TEMP/buildagent.keychain"
          keychain_password=$(openssl rand -base64 24)
          certificate="$RUNNER_TEMP/codesign.p12"
          printf '%s' "$CODESIGN_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$CODESIGN_CERTIFICATE_PASSWORD" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$certificate"
          swift package resolve
          key_file="$RUNNER_TEMP/sparkle_ed_key"
          (umask 077 && printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key_file")
          .build/artifacts/sparkle/Sparkle/bin/generate_keys --account com.anirudh.raycompanion.updates -f "$key_file"
          echo "SPARKLE_KEY_FILE=$key_file" >> "$GITHUB_ENV"

      - name: Build, sign and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/release.sh --publish

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # Keyless sigstore bundles prove the assets came from this workflow; there is no Developer ID yet.
      - name: Attach sigstore signatures
        env:
          COSIGN_YES: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cd "build/releases/$TAG"
          for asset in RayCompanion.dmg RayCompanion.zip; do
            cosign sign-blob --bundle "$asset.sigstore.json" "$asset"
          done
          gh release upload "$TAG" RayCompanion.dmg.sigstore.json RayCompanion.zip.sigstore.json \
            --repo "$GITHUB_REPOSITORY"

      - name: Delete the keychain and key file
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/buildagent.keychain" || true
          rm -f "$RUNNER_TEMP/sparkle_ed_key"
